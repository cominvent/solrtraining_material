[project]
name = "solrtraining_material"
version = "0.1.0"
description = "Serve solrtraining.com course material behind Frappe LMS access control"
authors = [{ name = "Cominvent AS", email = "jh@cominvent.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
# No runtime dependencies: the app runs inside a Frappe bench and uses only
# frappe + werkzeug, which the bench already provides. (flit_core supports
# dynamic metadata only for version/description — never declare
# dynamic = ["dependencies"], it breaks `bench init`/`uv pip install -e`.)
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "solrtraining_material"
